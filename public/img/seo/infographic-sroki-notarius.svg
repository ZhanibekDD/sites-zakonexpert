<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img" aria-label="Сроки по исполнительной надписи нотариуса в Казахстане">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1f35"/><stop offset="100%" stop-color="#1a4a7a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="180" rx="16" fill="url(#bg2)"/>
  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#efc96f" font-size="13" font-weight="800" font-family="Arial,sans-serif">СРОКИ ПО ИСПОЛНИТЕЛЬНОЙ НАДПИСИ</text>
  <!-- Block 1 -->
  <rect x="30" y="55" width="220" height="100" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(212,168,58,0.4)" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" fill="#efc96f" font-size="26" font-weight="900" font-family="Arial,sans-serif">10</text>
  <text x="140" y="100" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11" font-weight="700" font-family="Arial,sans-serif">рабочих дней</text>
  <text x="140" y="118" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">подать возражение</text>
  <text x="140" y="133" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">нотариусу</text>
  <!-- Block 2 -->
  <rect x="290" y="55" width="220" height="100" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(212,168,58,0.4)" stroke-width="1.5"/>
  <text x="400" y="82" text-anchor="middle" fill="#efc96f" font-size="26" font-weight="900" font-family="Arial,sans-serif">3</text>
  <text x="400" y="100" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11" font-weight="700" font-family="Arial,sans-serif">рабочих дня</text>
  <text x="400" y="118" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">нотариус выносит</text>
  <text x="400" y="133" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">постановление об отмене</text>
  <!-- Block 3 -->
  <rect x="550" y="55" width="220" height="100" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(212,168,58,0.4)" stroke-width="1.5"/>
  <text x="660" y="82" text-anchor="middle" fill="#efc96f" font-size="26" font-weight="900" font-family="Arial,sans-serif">3</text>
  <text x="660" y="100" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11" font-weight="700" font-family="Arial,sans-serif">года</text>
  <text x="660" y="118" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">срок предъявления</text>
  <text x="660" y="133" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10" font-family="Arial,sans-serif">исполнительной надписи</text>
</svg>
