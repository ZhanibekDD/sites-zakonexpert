<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2a47"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d7a742"/>
      <stop offset="100%" style="stop-color:#f0c060"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <circle cx="680" cy="100" r="160" fill="rgba(255,255,255,0.03)"/>
  <!-- Document with seal -->
  <g transform="translate(280,70)">
    <rect x="30" y="20" width="180" height="230" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="60" y1="70" x2="180" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="60" y1="95" x2="180" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="60" y1="120" x2="180" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="60" y1="145" x2="150" y2="145" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Seal -->
    <circle cx="150" cy="200" r="35" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="150" cy="200" r="25" fill="rgba(215,167,66,0.15)"/>
    <text x="150" y="207" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="url(#gold)" text-anchor="middle">N</text>
  </g>
  <text x="400" y="310" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">Исполнительная надпись</text>
  <text x="400" y="345" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">ZakonExpert — правовой разбор</text>
  <rect x="330" y="362" width="140" height="3" rx="2" fill="url(#gold)"/>
</svg>
