name: Migration branch checks

on:
  push:
    branches:
      - migration/zakonexpert-kz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify no old-domain stem remains
        run: node scripts/migrate-domain-to-zakonexpert-kz.js

      - name: Run full test suite
        run: npm test
