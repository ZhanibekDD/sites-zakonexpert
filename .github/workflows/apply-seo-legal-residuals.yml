name: Apply residual legal accuracy cleanup

on:
  push:
    branches:
      - growth/seo-snippets-legal-accuracy-7-pages

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: growth/seo-snippets-legal-accuracy-7-pages
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply residual legal cleanup
        run: |
          node --check scripts/fix-seo-legal-residuals.js
          node scripts/fix-seo-legal-residuals.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate HTML and run tests
        run: npm test

      - name: Commit generated cleanup
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish legal accuracy on seven SEO pages"
          git push origin HEAD:growth/seo-snippets-legal-accuracy-7-pages
