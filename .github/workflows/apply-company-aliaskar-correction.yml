name: Apply ALИАСКАР-2005 company correction

on:
  pull_request:
    branches:
      - main

concurrency:
  group: company-aliaskar-2005-correction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/company-aliaskar-2005-correction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply public company correction
        run: |
          node --check scripts/apply-company-aliaskar-correction.js
          node scripts/apply-company-aliaskar-correction.js
          rm -f scripts/apply-company-aliaskar-correction.js
          rm -f .github/workflows/apply-company-aliaskar-correction.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full site validation
        run: npm test

      - name: Commit generated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Correct ALИАСКАР-2005 status and former executive"
          git push origin HEAD:fix/company-aliaskar-2005-correction
