name: Private CRM checks
on:
  push:
    branches: [migration/zakonexpert-kz]
    paths:
      - 'crm-entry.js'
      - 'modules/crm-*.js'
      - 'views/crm/**'
      - 'scripts/test-crm.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crm-ci.yml'
  pull_request:
    branches: [migration/zakonexpert-kz]
    paths:
      - 'crm-entry.js'
      - 'modules/crm-*.js'
      - 'views/crm/**'
      - 'scripts/test-crm.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crm-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check crm-entry.js
          node --check modules/crm-db.js
          node --check modules/crm-contracts.js
          node --check modules/crm-routes.js
          node --check scripts/test-crm.js
      - name: CRM tests
        run: npm run test:crm
