name: CRM contract pipeline

on:
  pull_request:
    paths:
      - 'crm-entry.js'
      - 'modules/crm-*.js'
      - 'public/css/crm-reference.css'
      - 'public/js/crm-generator-ui.js'
      - 'public/js/crm-reference-*.js'
      - 'views/crm/**'
      - 'scripts/test-crm-contract-sync.js'
      - '.github/workflows/crm-contract-sync.yml'
  push:
    branches:
      - feature/private-crm-kanban-contract-sync
      - feature/crm-generator-inside-kanban
      - feature/crm-pull-worker-final
      - feature/crm-import-pull-final
      - feature/crm-reference-ui
    paths:
      - 'crm-entry.js'
      - 'modules/crm-*.js'
      - 'public/css/crm-reference.css'
      - 'public/js/crm-generator-ui.js'
      - 'public/js/crm-reference-*.js'
      - 'views/crm/**'
      - 'scripts/test-crm-contract-sync.js'
      - '.github/workflows/crm-contract-sync.yml'

jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check crm-entry.js
          node --check modules/crm-db.js
          node --check modules/crm-routes.js
          node --check modules/crm-generator-create.js
          node --check modules/crm-generation-jobs.js
          node --check modules/crm-contract-import.js
          node --check modules/crm-import-pull.js
          node --check modules/crm-ui-polish.js
          node --check public/js/crm-generator-ui.js
          node --check public/js/crm-reference-ui.js
          node --check public/js/crm-reference-archive.js
          node --check scripts/test-crm-contract-sync.js
      - name: Compile CRM view
        run: |
          node -e "const fs=require('fs'),ejs=require('ejs'); ejs.compile(fs.readFileSync('views/crm/dashboard.ejs','utf8'), {filename:'views/crm/dashboard.ejs'}); console.log('CRM EJS compile PASS')"
      - name: CRM contract integration tests
        run: node scripts/test-crm-contract-sync.js
