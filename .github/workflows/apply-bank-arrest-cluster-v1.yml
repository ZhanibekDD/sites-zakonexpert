name: Apply bank arrest growth cluster v1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - growth/bank-arrest-cluster-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out growth branch
        uses: actions/checkout@v4
        with:
          ref: growth/bank-arrest-cluster-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bank cluster and growth routes
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          target = Path('scripts/apply-bank-arrest-cluster-v1.js')
          source = target.read_text(encoding='utf-8')
          target.write_text(source.replace('\\\\`', '\\`'), encoding='utf-8')
          PYCODE
          node --check scripts/apply-bank-arrest-cluster-v1.js
          node scripts/apply-bank-arrest-cluster-v1.js
          rm -f scripts/apply-bank-arrest-cluster-v1.js
          rm -f .github/workflows/apply-bank-arrest-cluster-v1.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate site and render new pages
        run: npm test

      - name: Commit generated growth release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build bank arrest cluster and high-intent legal routes"
          git push origin HEAD:growth/bank-arrest-cluster-v1
