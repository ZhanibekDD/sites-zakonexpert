name: Raise migration chat CTA

on:
  push:
    branches:
      - migration/zakonexpert-kz
    paths:
      - .github/workflows/migration-chat-offset.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/zakonexpert-kz
          fetch-depth: 0
      - name: Raise desktop lead button above WhatsApp CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/js/chatbot.js')
          s = p.read_text(encoding='utf-8-sig')
          old_btn = '#zke-chat-btn{position:fixed;bottom:18px;right:18px;'
          new_btn = '#zke-chat-btn{position:fixed;bottom:82px;right:18px;'
          old_box = '#zke-chat-box{position:fixed;bottom:88px;right:20px;'
          new_box = '#zke-chat-box{position:fixed;bottom:152px;right:20px;'
          if old_btn not in s or old_box not in s:
              raise SystemExit('Expected chatbot position rules not found')
          s = s.replace(old_btn, new_btn, 1).replace(old_box, new_box, 1)
          p.write_text('\ufeff' + s, encoding='utf-8')
          PY
      - name: Commit position adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/chatbot.js
          git commit -m 'Raise floating lead CTA above WhatsApp action'
          git push origin HEAD:migration/zakonexpert-kz
