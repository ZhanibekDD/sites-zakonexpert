name: Apply money-page growth sprint 1

on:
  push:
    branches:
      - growth/money-pages-sprint-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out growth branch
        uses: actions/checkout@v4
        with:
          ref: growth/money-pages-sprint-1
          fetch-depth: 0

      - name: Restore migration script
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip
          from pathlib import Path
          payload = Path('scripts/apply-money-page-growth-sprint-1.js.gz.b64').read_text(encoding='utf-8').strip()
          target = Path('scripts/apply-money-page-growth-sprint-1.js')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PYCODE

      - name: Apply SEO, trust and conversion upgrades
        shell: bash
        run: |
          node scripts/apply-money-page-growth-sprint-1.js
          rm -f scripts/apply-money-page-growth-sprint-1.js.gz.b64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full validation suite
        run: npm test

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            public/arest-kaspi.html \
            public/arest-halyk-bank.html \
            public/zapret-na-vyezd-iz-kazahstana.html \
            public/snyatie-aresta-so-scheta.html \
            public/chsi-arest-schetov.html \
            public/chsi-ne-snimaet-arest-posle-oplaty.html \
            public/sms-1414.html \
            public/css/money-page-growth.css \
            scripts/apply-money-page-growth-sprint-1.js.gz.b64 \
            .github/workflows/apply-money-page-growth-sprint-1.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve seven high-intent SEO landing pages"
          git push origin HEAD:growth/money-pages-sprint-1
