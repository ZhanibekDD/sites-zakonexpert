name: Apply production header cleanup

on:
  push:
    branches:
      - fix/production-header-cleanup-20260906

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out production cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-header-cleanup-20260906
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply production cleanup
        run: |
          node --check scripts/apply-production-header-cleanup-20260906.js
          node scripts/apply-production-header-cleanup-20260906.js

      - name: Regenerate WhatsApp QR
        shell: bash
        run: |
          if [ -f public/img/contact/whatsapp-zakonexpert-qr.svg ]; then
            python -m pip install --disable-pip-version-check qrcode
            python - <<'PYCODE'
          from pathlib import Path
          import qrcode
          from qrcode.image.svg import SvgPathImage

          url = 'https://wa.me/77058762795'
          target = Path('public/img/contact/whatsapp-zakonexpert-qr.svg')
          image = qrcode.make(url, image_factory=SvgPathImage, box_size=10, border=4)
          with target.open('wb') as output:
              image.save(output)
          svg = target.read_text(encoding='utf-8')
          svg = svg.replace(
              '<svg ',
              '<svg data-whatsapp-url="https://wa.me/77058762795" role="img" aria-label="QR-код WhatsApp компании ZakonExpert" ',
              1,
          )
          target.write_text(svg, encoding='utf-8')
          PYCODE
          fi

      - name: Verify migration is idempotent
        run: node scripts/apply-production-header-cleanup-20260906.js

      - name: Align regression guards after profile removal
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          trust = Path('scripts/test-trust-legal-security.js')
          source = trust.read_text(encoding='utf-8')
          old = r'js\/chatbot\.js\?v=20260828-1'
          new = r'js\/chatbot\.js\?v=20260906-1'
          if old not in source:
              raise SystemExit('chatbot cache guard anchor not found')
          trust.write_text(source.replace(old, new), encoding='utf-8')

          laws = Path('scripts/test-laws-reader.js')
          source = laws.read_text(encoding='utf-8')
          old_phone = "assert(articleHtml.includes('tel:+77777457577'), 'Article CTA must call the advocate directly');"
          new_phone = "assert(articleHtml.includes('tel:+77058762795'), 'Article CTA must call ZakonExpert directly');"
          old_profile = "assert(articleHtml.includes('/advocate'), 'Article must link to the advocate profile');"
          new_profile = "assert(!articleHtml.includes('tel:+77777457577') && !articleHtml.includes('/img/advocate/maulen-erzhanov.jpg'), 'Article must not render the retired personal advocate CTA');"
          if old_phone not in source or old_profile not in source:
              raise SystemExit('law reader advocate guard anchors not found')
          source = source.replace(old_phone, new_phone).replace(old_profile, new_profile)
          laws.write_text(source, encoding='utf-8')

          smoke = Path('scripts/smoke-test.js')
          source = smoke.read_text(encoding='utf-8')
          old_routes = "      '/advocate',\n      '/mediator',\n"
          if old_routes not in source:
              raise SystemExit('smoke retired profile route anchors not found')
          source = source.replace(old_routes, '')
          anchor = "    for (const route of routes) await expectGet(route);\n"
          gone_check = "    for (const removedProfile of ['/advocate', '/mediator']) {\n      const response = await fetch(`${origin}${removedProfile}`, { redirect: 'manual' });\n      assert(response.status === 410, `${removedProfile}: expected 410, received ${response.status}`);\n      assert(response.headers.get('content-security-policy')?.includes(\"default-src 'self'\"), `${removedProfile}: missing security headers`);\n    }\n"
          if anchor not in source:
              raise SystemExit('smoke route loop anchor not found')
          source = source.replace(anchor, anchor + gone_check)
          smoke.write_text(source, encoding='utf-8')
          PYCODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run contact and syntax checks
        run: |
          if [ -f scripts/test-contact-number.js ]; then node scripts/test-contact-number.js; fi
          node --check public/js/site.js
          if [ -f public/js/chatbot.js ]; then node --check public/js/chatbot.js; fi

      - name: Run full validation suite
        run: npm test

      - name: Commit production cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-production-header-cleanup-20260906.js
          rm -f .github/workflows/apply-production-header-cleanup-20260906.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Finish production contact and header cleanup"
          git push origin HEAD:fix/production-header-cleanup-20260906
